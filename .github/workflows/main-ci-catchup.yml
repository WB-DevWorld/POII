name: Main CI catch-up
# Routine PRs are merged by GitHub auto-merge, which `classify` enables with the workflow token. GitHub
# starts no workflow for a push made with that token, so such a merge left `main` without CI and without
# published images (#53 `7dff763`, #72 `efe2e04`). This workflow starts CI on `main` when its head commit
# has no CI run. GitHub also raises no `workflow_run` event when a run started with the workflow token
# finishes (observed on 2026-11-25 with #81), so nothing would follow that CI run. The script therefore
# walks the rest of the release path itself: the image publish, the staging deploy, and the start of
# the production promotion, each only after the step before succeeded.
# Logic and tests: infra/scripts/main-ci-catchup.sh, main-ci-catchup.test.mjs.
# It reads pull request and run metadata and starts workflows on main. It never checks out or runs code from a pull request.
on:
  # An auto-merge lands when the last required check finishes. That is usually CI, but it is the risk
  # classification when that one finishes last, for example after a re-run (#81 on 2026-11-25: `classify`
  # was re-run after a GitHub outage, the merge landed eleven minutes after CI, and nothing started CI on
  # `main` until this workflow was dispatched by hand).
  workflow_run:
    workflows: [CI, Risk classification]
    types: [completed]
  # Backstop for merges the triggers above missed (an API hiccup, a check outside these two finishing last).
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  # To start CI, the publish and the deploys on main (workflow_dispatch is the one event the workflow token may raise).
  actions: write
concurrency:
  group: main-ci-catchup
  cancel-in-progress: false
defaults:
  run:
    shell: bash  # bash -eo pipefail
jobs:
  catch-up:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # CI, the image publish and the staging deploy are awaited one after the other.
    timeout-minutes: 120
    steps:
      # workflow_run, schedule and workflow_dispatch all run in the context of the default branch, so this
      # checks out main: the script is the reviewed one, never code from a pull request.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: infra/scripts
      - name: Walk the release path for a head commit of main that has no CI run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          STAGING_ENABLED: ${{ vars.POII_STAGING_ENABLED }}
          PRODUCTION_ENABLED: ${{ vars.POII_PRODUCTION_ENABLED }}
        run: bash infra/scripts/main-ci-catchup.sh
