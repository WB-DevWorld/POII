name: Deploy staging
# Release policy steps 1-3: deploy the digests published for a main commit to staging, wait for the
# new SHA, run the staging smoke and write the release manifest. Runbook: docs/runbooks/staging-deploy.md.
# A no-op until the repository variable POII_STAGING_ENABLED is 'true'. Production promotion is not here.
on:
  workflow_run:
    workflows: ["Publish immutable images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Full 40-hex main commit whose published images to (re)deploy"
        required: true
        type: string
      dry_run:
        description: "Only read and validate Dokploy; change nothing"
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  packages: read
  actions: read
defaults:
  run:
    shell: bash  # bash -eo pipefail
jobs:
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.resolve.outputs.enabled }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      publish_run_id: ${{ steps.resolve.outputs.publish_run_id }}
    steps:
      - name: Check the switch and resolve the published release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ENABLED: ${{ vars.POII_STAGING_ENABLED }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          note() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          echo "## Deploy staging" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" = workflow_dispatch ] && [ "${INPUT_DRY_RUN:-}" = true ]; then
            note "Dry run: Dokploy is only read, never changed (allowed while deploys are switched off)."
          elif [ "${ENABLED:-}" != "true" ]; then
            note "Staging deploys are switched off: the repository variable \`POII_STAGING_ENABLED\` is not \`true\`. Nothing was deployed. See docs/runbooks/staging-deploy.md."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ]; then
            [ "$REF" = refs/heads/main ] || { note "Manual deploys run from main only (got $REF)."; exit 1; }
            [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { note "source_sha must be a full 40-character lowercase hex SHA."; exit 1; }
            artifact="$(gh api "repos/$REPO/actions/artifacts?name=poii-release-$INPUT_SHA&per_page=100" \
              --jq "[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == \"main\" and .workflow_run.head_sha == \"$INPUT_SHA\")] | sort_by(.created_at) | last // empty")"
            [ -n "$artifact" ] || { note "No unexpired artifact \`poii-release-$INPUT_SHA\` from a main run for that SHA exists (published only for main commits, kept 90 days)."; exit 1; }
            run_id="$(jq -r '.workflow_run.id' <<<"$artifact")"
            sha="$INPUT_SHA"
          else
            run_id="$TRIGGER_RUN_ID"
            names="$(gh api "repos/$REPO/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired | not) | .name | select(test("^poii-release-[0-9a-f]{40}$"))] | join(" ")')"
            count="$(wc -w <<<"$names")"
            if [ "$count" -eq 0 ]; then
              note "Publish run $run_id produced no release artifact (its images job was skipped). Nothing to deploy."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [ "$count" -eq 1 ] || { note "Publish run $run_id has $count release artifacts; expected one."; exit 1; }
            sha="${names#poii-release-}"
          fi
          run="$(gh api "repos/$REPO/actions/runs/$run_id")"
          path="$(jq -r '.path' <<<"$run")"; conclusion="$(jq -r '.conclusion' <<<"$run")"; branch="$(jq -r '.head_branch' <<<"$run")"
          head_repo="$(jq -r '.head_repository.full_name' <<<"$run")"; run_sha="$(jq -r '.head_sha' <<<"$run")"
          if [ "$path" != .github/workflows/publish.yml ] || [ "$conclusion" != success ] || [ "$branch" != main ] || [ "$head_repo" != "$REPO" ]; then
            note "Run $run_id is not a successful main run of the publish workflow in this repository (path $path, conclusion $conclusion, branch $branch)."
            exit 1
          fi
          if [ "$run_sha" != "$sha" ]; then
            note "Publish run $run_id ran for \`$run_sha\` but its release artifact names \`$sha\`; refusing to guess. This can happen when main moved on between CI and publish; the next main commit's publish run deploys normally."
            exit 1
          fi
          note "Source \`$sha\` from publish run [$run_id](https://github.com/$REPO/actions/runs/$run_id)."
          {
            echo "enabled=true"
            echo "source_sha=$sha"
            echo "publish_run_id=$run_id"
          } >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_BASE_URL }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check staging configuration is present
        env:
          HAS_URL: ${{ secrets.DOKPLOY_URL != '' }}
          HAS_TOKEN: ${{ secrets.DOKPLOY_TOKEN != '' }}
          HAS_COMPOSE: ${{ secrets.DOKPLOY_COMPOSE_ID != '' }}
          WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_URL" = true ] || missing+=("secret DOKPLOY_URL")
          [ "$HAS_TOKEN" = true ] || missing+=("secret DOKPLOY_TOKEN")
          [ "$HAS_COMPOSE" = true ] || missing+=("secret DOKPLOY_COMPOSE_ID")
          [[ "${WEB_BASE_URL:-}" =~ ^https://[^/]+/?$ ]] || missing+=("variable STAGING_WEB_BASE_URL (https origin, no path)")
          if [ ${#missing[@]} -gt 0 ]; then
            printf -- '- %s\n' "${missing[@]}" | { echo "**Staging environment is not configured.** Missing in the \`staging\` environment:"; cat; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Staging environment is missing: ${missing[*]}"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: poii-release-${{ needs.gate.outputs.source_sha }}
          run-id: ${{ needs.gate.outputs.publish_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release

      - name: Resolve and verify image digests
        id: images
        env:
          GHCR_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/release/release.txt"
          [ -f "$file" ] || { echo "::error::release.txt missing from the release artifact"; exit 1; }
          field() { sed -n "s/^$1: //p" "$file" | tr -d '\r'; }
          source="$(field Source)"; api="$(field API)"; web="$(field Web)"
          [ "$source" = "$SOURCE_SHA" ] || { echo "::error::Artifact source '$source' does not match $SOURCE_SHA"; exit 1; }
          [[ "$api" =~ ^ghcr\.io/wb-devworld/poii-api@sha256:[0-9a-f]{64}$ ]] || { echo "::error::API image reference missing or malformed: '$api'"; exit 1; }
          [[ "$web" =~ ^ghcr\.io/wb-devworld/poii-web@sha256:[0-9a-f]{64}$ ]] || { echo "::error::Web image reference missing or malformed: '$web'"; exit 1; }
          # Cross-check against the registry: the sha-<SOURCE_SHA> tags must point at the same digests.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin >/dev/null
          for pair in "poii-api $api" "poii-web $web"; do
            set -- $pair
            tagged="$(docker buildx imagetools inspect "ghcr.io/wb-devworld/$1:sha-$SOURCE_SHA" --format '{{json .Manifest}}' | jq -r '.digest')"
            [ "ghcr.io/wb-devworld/$1@$tagged" = "$2" ] || { echo "::error::GHCR tag $1:sha-$SOURCE_SHA points at $tagged, the artifact says ${2#*@}"; exit 1; }
          done
          docker logout ghcr.io >/dev/null
          {
            echo "api_image=$api"
            echo "web_image=$web"
          } >> "$GITHUB_OUTPUT"
          { echo "### Images"; echo; echo "- API: \`$api\`"; echo "- Web: \`$web\`"; echo; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Point Dokploy at the new digests and deploy
        id: dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          GIT_SHA: ${{ needs.gate.outputs.source_sha }}
          DEPLOY_TITLE: POII staging ${{ needs.gate.outputs.source_sha }} run ${{ github.run_id }}.${{ github.run_attempt }}
          DEPLOY_TIMEOUT_SECONDS: '1200'
          DOKPLOY_DRY_RUN: ${{ env.DRY_RUN }}
        run: node infra/scripts/dokploy-deploy.mjs

      - name: Wait for the new SHA on /health/ready
        id: ready
        if: env.DRY_RUN != 'true'
        env:
          POII_WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
          POII_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          POII_EXPECTED_SHA: ${{ needs.gate.outputs.source_sha }}
          POII_READY_TIMEOUT_SECONDS: '600'
        run: bash infra/scripts/staging-smoke.sh wait

      - name: Staging smoke
        if: env.DRY_RUN != 'true'
        env:
          POII_WEB_BASE_URL: ${{ vars.STAGING_WEB_BASE_URL }}
          POII_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          POII_EXPECTED_SHA: ${{ needs.gate.outputs.source_sha }}
          POII_STAGING_E2E_AUTH: ${{ vars.POII_STAGING_E2E_AUTH }}
        run: bash infra/scripts/staging-smoke.sh check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the release manifest
        if: env.DRY_RUN != 'true'
        id: manifest
        env:
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          WEB_IMAGE: ${{ steps.images.outputs.web_image }}
          DEPLOYED_AT: ${{ steps.dokploy.outputs.deployed_at }}
          OBSERVED: ${{ steps.ready.outputs.observed_ready_version }}
        run: |
          set -euo pipefail
          stamp="$(date -u -d "$DEPLOYED_AT" +%Y%m%dT%H%M%SZ)"
          name="staging-$stamp-${SOURCE_SHA:0:12}.json"
          previous="$(ls infra/releases/staging-*.json 2>/dev/null | sort | tail -n 1 | xargs -r basename || true)"
          mkdir -p "$RUNNER_TEMP/manifest"
          PREVIOUS="$previous" node -e '
            const e = process.env;
            const manifest = { sourceSha: e.SOURCE_SHA, api: e.API_IMAGE, web: e.WEB_IMAGE, environment: "staging",
              deployedAt: e.DEPLOYED_AT, observedReadyVersion: e.OBSERVED, previous: e.PREVIOUS || null };
            process.stdout.write(JSON.stringify(manifest, null, 2) + "\n");' > "$RUNNER_TEMP/manifest/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Release manifest \`infra/releases/$name\`"
            echo
            echo '```json'
            cat "$RUNNER_TEMP/manifest/$name"
            echo '```'
            echo
            echo "Record it through a normal PR: add this file under \`infra/releases/\` (gated path) and the observation in \`LIVE-ENVIRONMENT-FACTS.md\`. This workflow never pushes to main."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: env.DRY_RUN != 'true'
        with:
          name: poii-staging-manifest-${{ needs.gate.outputs.source_sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manifest/${{ steps.manifest.outputs.name }}
          retention-days: 90
          if-no-files-found: error

      - name: Explain the failure
        if: failure()
        env:
          PREV_API: ${{ steps.dokploy.outputs.previous_api_image }}
          PREV_WEB: ${{ steps.dokploy.outputs.previous_web_image }}
          PREV_SHA: ${{ steps.dokploy.outputs.previous_git_sha }}
          ENV_UPDATED: ${{ steps.dokploy.outputs.env_update_attempted }}
          RUNBOOK: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/runbooks/rollback-and-restore.md
        run: |
          {
            echo "### Staging deploy of \`$SOURCE_SHA\` FAILED"
            echo
            echo "Nothing was rolled back automatically. Read the failed step above, then decide."
            if [ "$ENV_UPDATED" = true ]; then
              echo "This run changed the Dokploy environment. Values before this run (one-step rollback target):"
              echo "- \`API_IMAGE\`: \`${PREV_API:-(not set)}\`"
              echo "- \`WEB_IMAGE\`: \`${PREV_WEB:-(not set)}\`"
              echo "- \`GIT_SHA\`: \`${PREV_SHA:-(not set)}\`"
            else
              echo "Dokploy was not changed by this run (the failure happened before the environment update)."
            fi
            echo
            echo "Rollback procedure: [rollback and restore runbook]($RUNBOOK) §1. Never restore the database as part of an app rollback."
          } >> "$GITHUB_STEP_SUMMARY"
