name: Publish immutable images
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # By hand, or by main-ci-catchup.yml for a commit whose CI run was started with the workflow token
  # (GitHub raises no workflow_run event when such a run finishes). A manual start takes no input: it
  # builds the head of main, and only when a CI run on main passed for exactly that commit.
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  # The manual start checks that CI passed for the commit.
  actions: read
jobs:
  images:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-main
      cancel-in-progress: false
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - name: A manual start publishes only a main commit that passed CI
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          passed="$(gh api -X GET "repos/$REPO/actions/workflows/ci.yml/runs" -f branch=main -f head_sha="$SHA" -f status=success -f per_page=1 --jq .total_count)"
          if ! [[ "$passed" =~ ^[0-9]+$ ]] || [ "$passed" -eq 0 ]; then
            echo "::error::No successful CI run on main for $SHA. Nothing is published."
            exit 1
          fi
          echo "CI passed on main for \`$SHA\`. Publishing its images." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: ghcr.io/wb-devworld/poii-api:sha-${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/build-push-action@v7
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          tags: ghcr.io/wb-devworld/poii-web:sha-${{ github.event.workflow_run.head_sha || github.sha }}
      # ci.yml scans its own build of the same Dockerfiles. This reads the bytes that were pushed: each image is
      # pulled back by the digest the push returned and scanned with the same script (every layer for forbidden
      # names and non-runtime material, gitleaks over /app and the image configuration). Both are always scanned.
      # It runs before the release record is written. A failed scan leaves the images in the registry under
      # their sha tag, but writes no record, and without the record nothing deploys them: deploy-staging.yml and
      # main-ci-catchup.sh both stop when the publish did not succeed.
      - name: Scan the pushed images for secrets and forbidden material
        env:
          API_IMAGE: ghcr.io/wb-devworld/poii-api@${{ steps.api.outputs.digest }}
          WEB_IMAGE: ghcr.io/wb-devworld/poii-web@${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail
          status=0
          for pair in "api $API_IMAGE" "web $WEB_IMAGE"; do
            name="${pair%% *}"
            ref="${pair#* }"
            [[ "$ref" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "::error::The push of the $name image returned no digest."; exit 1; }
            docker pull --quiet "$ref"
            # The scan reads a local image by name; the tag exists only on this runner.
            docker tag "$ref" "poii-$name:pushed"
            bash infra/scripts/artifact-scan.sh image "poii-$name:pushed" || status=1
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::A pushed image failed the scan. No release record is written, so nothing deploys it."
          fi
          exit "$status"
      - name: Record immutable image references
        run: |
          {
            echo "Source: ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "API: ghcr.io/wb-devworld/poii-api@${{ steps.api.outputs.digest }}"
            echo "Web: ghcr.io/wb-devworld/poii-web@${{ steps.web.outputs.digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" > release.txt
      - uses: actions/upload-artifact@v7
        with:
          name: poii-release-${{ github.event.workflow_run.head_sha || github.sha }}
          path: release.txt
          retention-days: 90
  # Staging deployment by digest is added in M2 once the Dokploy project and scoped token exist.
  # Production promotion stays inactive until the owner's activation phrase is recorded.
