name: Publish immutable images
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  images:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: publish-main
      cancel-in-progress: false
    outputs:
      api_digest: ${{ steps.api.outputs.digest }}
      web_digest: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: api
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: ghcr.io/wb-devworld/poii-api:sha-${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        id: web
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: GIT_SHA=${{ github.event.workflow_run.head_sha }}
          tags: ghcr.io/wb-devworld/poii-web:sha-${{ github.event.workflow_run.head_sha }}
      - name: Record immutable image references
        run: |
          {
            echo "Source: ${{ github.event.workflow_run.head_sha }}"
            echo "API: ghcr.io/wb-devworld/poii-api@${{ steps.api.outputs.digest }}"
            echo "Web: ghcr.io/wb-devworld/poii-web@${{ steps.web.outputs.digest }}"
          } | tee -a "$GITHUB_STEP_SUMMARY" > release.txt
      - uses: actions/upload-artifact@v4
        with:
          name: poii-release-${{ github.event.workflow_run.head_sha }}
          path: release.txt
          retention-days: 90
  # Staging deployment by digest is added in M2 once the Dokploy project and scoped token exist.
  # Production promotion stays inactive until the owner's activation phrase is recorded.
